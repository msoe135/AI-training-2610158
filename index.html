<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>절차서 교육 시스템</title>
<!-- SheetJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- FontAwesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --line: #e2e8f0;
    
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    
    --success: #10b981;
    --success-light: #ecfdf5;
    --danger: #ef4444;
    --danger-light: #fef2f2;
    --warning: #f59e0b;
    --warning-light: #fffbeb;
    
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px -2px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* HEADER */
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  
  .header-top {
    padding: 24px 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  h1 i { color: var(--primary); }

  .missing { color: var(--text-muted); font-style: italic; font-weight: 400; font-size: 0.95rem; }

  /* MAIN NAV (분야 탭) */
  .areas-wrapper {
    overflow-x: auto;
    scrollbar-width: none; /* Firefox */
  }
  .areas-wrapper::-webkit-scrollbar { display: none; } /* Chrome/Safari */

  .areas {
    display: flex;
    gap: 8px;
    padding-bottom: 12px;
  }

  .areas button {
    border: none;
    background: transparent;
    padding: 10px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    transition: all 0.2s ease;
  }

  .areas button:hover {
    background: var(--primary-light);
    color: var(--primary);
  }

  .areas button.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
  }

  /* MAIN CONTENT */
  main { padding: 32px 0 80px; }

  /* SUB TABS */
  .subs {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    background: #e2e8f033;
    padding: 6px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    width: fit-content;
  }

  .subs button {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    padding: 8px 18px;
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .subs button:hover { color: var(--text-primary); }

  .subs button.active {
    background: var(--card-bg);
    color: var(--primary);
    box-shadow: var(--shadow-sm);
  }

  .subs .count {
    background: var(--line);
    color: var(--text-secondary);
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 0.75rem;
  }

  .subs button.active .count {
    background: var(--primary-light);
    color: var(--primary);
  }

  /* SECTION TITLE */
  h2 {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 28px 0 14px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 16px;
    background: var(--primary);
    border-radius: 2px;
  }
  h2:first-child { margin-top: 0; }

  /* EMPTY & NOTICE */
  .empty {
    background: var(--card-bg);
    border: 2px dashed var(--line);
    border-radius: var(--radius-lg);
    padding: 48px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .notice {
    background: var(--danger-light);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    font-weight: 500;
  }

  /* CARDS LIST */
  .list { display: grid; gap: 12px; }

  .item {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }

  .item:hover {
    border-color: #cbd5e1;
    box-shadow: var(--shadow-md);
  }

  .item .info { flex: 1; min-width: 240px; }
  .item .title { font-weight: 600; font-size: 1rem; color: var(--text-primary); }
  .item .desc { color: var(--text-secondary); font-size: 0.88rem; margin-top: 4px; }

  /* TAGS & BUTTONS */
  .tag {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    background: #f1f5f9;
    color: var(--text-secondary);
    border: 1px solid var(--line);
    text-transform: uppercase;
  }

  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .btn {
    border: 1px solid var(--line);
    background: var(--card-bg);
    color: var(--text-secondary);
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }

  .btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .btn.primary:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
    color: #fff;
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
  }

  .slot { flex-basis: 100%; margin-top: 10px; }
  .slot:empty { display: none; }

  .pdf {
    width: 100%;
    height: 75vh;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: #fff;
    margin-top: 10px;
  }

  .player {
    background: #000;
    border-radius: var(--radius-md);
    overflow: hidden;
    aspect-ratio: 16 / 9;
    box-shadow: var(--shadow-md);
    margin-top: 10px;
  }
  .player video, .player iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* QUIZ STYLES */
  .q {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s ease;
  }

  .q.correct { border-color: var(--success); background: var(--success-light); }
  .q.wrong { border-color: var(--danger); background: var(--danger-light); }
  .q.self { border-color: var(--warning); background: var(--warning-light); }

  .q-head {
    font-weight: 700;
    font-size: 1.02rem;
    margin-bottom: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .q label {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s ease;
    margin-bottom: 4px;
  }

  .q label:hover { background: #f1f5f9; }
  .q label.answer { font-weight: 700; color: var(--success); background: #dcfce7; }
  .q input[type=radio] { accent-color: var(--primary); width: 16px; height: 16px; }

  .q textarea {
    width: 100%;
    min-height: 100px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
    background: #fff;
    outline: none;
  }
  .q textarea:focus { border-color: var(--primary); }

  .feedback {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    font-size: 0.92rem;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  .feedback b { display: block; margin-bottom: 4px; font-weight: 700; }

  .result {
    background: var(--card-bg);
    border: 2px solid var(--primary);
    border-radius: var(--radius-md);
    padding: 20px;
    margin-bottom: 24px;
    display: none;
    text-align: center;
    box-shadow: var(--shadow-md);
  }
  .result strong { font-size: 1.2rem; color: var(--primary); }

  .quiz-actions { display: flex; gap: 10px; margin-top: 20px; }
  .warn { color: var(--danger); font-size: 0.9rem; margin-top: 10px; font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="header-top">
      <h1 id="siteTitle"><i class="fa-solid fa-graduation-cap"></i> 절차서 교육</h1>
    </div>
    <div class="areas-wrapper">
      <nav class="areas" id="areas"></nav>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="content">
    <div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> 자료를 불러오는 중입니다…</div>
  </div>
</main>

<script>
/* 데이터는 같은 폴더의 data.xlsx에서 읽습니다. 내용 수정은 엑셀에서 하세요. */
const DATA_FILE = "data.xlsx";

const SUB_TABS = [
  { id: "docs", label: "절차서·양식", icon: "fa-file-lines" },
  { id: "video", label: "비디오", icon: "fa-circle-play" },
  { id: "quiz", label: "시험", icon: "fa-pen-to-square" },
  { id: "ref", label: "참고자료", icon: "fa-bookmark" },
];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const str = v => String(v ?? "").trim();
const ext = f => (str(f).split("?")[0].split(".").pop() || "").toLowerCase();
const toUrl = p => /^https?:\/\//i.test(p) ? p : str(p).split("/").map(encodeURIComponent).join("/");
const emptyBox = msg => `<div class="empty">${msg}</div>`;
const titleOf = t => esc(t) || '<span class="missing">제목 미입력</span>';
const youtubeId = url => (String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/) || [])[1] || null;

let DB = { docs: [], quiz: [], refs: [], areas: [] };
let state = { area: null, sub: "docs" };

/* ---------- 엑셀 읽기 ---------- */
function rowsOf(wb, name) {
  const ws = wb.Sheets[name];
  if (!ws) return [];
  return XLSX.utils.sheet_to_json(ws, { defval: "" })
    .map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [str(k), v])))
    .filter(r => str(r["분야"]));
}

async function load() {
  const content = document.getElementById("content");
  if (typeof XLSX === "undefined") {
    content.innerHTML = `<div class="notice"><i class="fa-solid fa-triangle-exclamation"></i> 엑셀을 읽는 프로그램(SheetJS)을 불러오지 못했습니다. 인터넷 연결이나 네트워크 상태를 확인해 주세요.</div>`;
    return;
  }
  let wb;
  try {
    const res = await fetch(DATA_FILE + "?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    wb = XLSX.read(await res.arrayBuffer(), { type: "array" });
  } catch (e) {
    content.innerHTML = location.protocol === "file:"
      ? `<div class="notice"><i class="fa-solid fa-triangle-exclamation"></i> PC에서 파일을 직접 열면 보안 설정 때문에 data.xlsx를 읽을 수 없습니다. 웹 서버 환경(GitHub Pages 등)을 이용해 주세요.</div>`
      : `<div class="notice"><i class="fa-solid fa-triangle-exclamation"></i> data.xlsx를 불러오지 못했습니다. index.html과 같은 폴더에 data.xlsx 파일이 존재하는지 확인해 주세요.</div>`;
    return;
  }

  // 설정
  const setting = (XLSX.utils.sheet_to_json(wb.Sheets["설정"] || {}, { header: 1, defval: "" }) || [])
    .find(r => str(r[0]) === "사이트 제목");
  const title = setting ? str(setting[1]) : "";
  const titleEl = document.getElementById("siteTitle");
  if (title) { titleEl.innerHTML = `<i class="fa-solid fa-graduation-cap"></i> ${title}`; document.title = title; }
  else titleEl.innerHTML = '<i class="fa-solid fa-graduation-cap"></i> <span class="missing">사이트 제목 미입력 (data.xlsx › 설정 시트)</span>';

  DB.docs = rowsOf(wb, "자료").map(r => ({
    area: str(r["분야"]), kind: str(r["구분"]), title: str(r["제목"]),
    view: str(r["보기파일(PDF)"]), file: str(r["원본파일"]),
  }));
  DB.quiz = rowsOf(wb, "시험문제").map((r, i) => ({
    area: str(r["분야"]), no: Number(r["번호"]) || 1e6 + i, type: str(r["유형"]) || "객관식",
    q: str(r["문제"]),
    options: ["보기1", "보기2", "보기3", "보기4"].map(k => str(r[k])).filter(Boolean),
    answer: str(r["정답"]), explain: str(r["해설"]),
  }));
  DB.refs = rowsOf(wb, "참고자료").map(r => ({
    area: str(r["분야"]), kind: str(r["구분"]), title: str(r["제목"]),
    url: str(r["URL"]), desc: str(r["설명"]),
  }));

  const seen = [];
  [...DB.docs, ...DB.quiz, ...DB.refs].forEach(r => {
    if (r.area !== "공통" && !seen.includes(r.area)) seen.push(r.area);
  });
  DB.areas = seen;

  if (!DB.areas.length) {
    content.innerHTML = emptyBox("data.xlsx에 등록된 자료가 없습니다.");
    return;
  }

  const [a, s] = decodeURIComponent(location.hash.slice(1)).split("/");
  state.area = DB.areas.includes(a) ? a : DB.areas[0];
  state.sub = SUB_TABS.some(t => t.id === s) ? s : "docs";
  renderAreas();
  render();
}

/* ---------- 탭 ---------- */
function renderAreas() {
  const nav = document.getElementById("areas");
  nav.innerHTML = DB.areas.map(a =>
    `<button data-area="${esc(a)}" class="${a === state.area ? "active" : ""}">${esc(a)}</button>`).join("");
  nav.onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    state.area = b.dataset.area;
    state.sub = "docs";
    renderAreas();
    render();
  };
}

function counts(area) {
  return {
    docs: DB.docs.filter(d => d.area === area && d.kind !== "비디오").length,
    video: DB.docs.filter(d => d.area === area && d.kind === "비디오").length,
    quiz: DB.quiz.filter(q => q.area === area).length,
    ref: DB.refs.filter(r => r.area === area || r.area === "공통").length,
  };
}

function render() {
  history.replaceState(null, "", "#" + encodeURIComponent(state.area) + "/" + state.sub);
  const c = counts(state.area);
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="subs" id="subs">
      ${SUB_TABS.map(t => `<button data-sub="${t.id}" class="${t.id === state.sub ? "active" : ""}"><i class="fa-solid ${t.icon}"></i>${t.label}<span class="count">${c[t.id]}</span></button>`).join("")}
    </div>
    <div id="panel"></div>`;
  document.getElementById("subs").onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    state.sub = b.dataset.sub;
    render();
  };
  const panel = document.getElementById("panel");
  ({ docs: renderDocs, video: renderVideo, quiz: renderQuiz, ref: renderRefs })[state.sub](panel);
}

/* ---------- 절차서·양식 ---------- */
function docItem(d, key) {
  const fileExt = d.file ? ext(d.file) : "";
  const canView = d.view && ext(d.view) === "pdf";
  return `
  <div class="item">
    <div class="info">
      <div class="title">${titleOf(d.title)}</div>
      ${!d.file && !d.view ? '<div class="desc missing">파일 경로 미입력</div>' : ""}
    </div>
    <div class="actions">
      ${fileExt ? `<span class="tag">${esc(fileExt)}</span>` : ""}
      ${canView ? `<button class="btn" data-view="${key}"><i class="fa-regular fa-eye"></i> 미리보기</button>
                   <a class="btn" href="${toUrl(d.view)}" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> 새 창</a>` : ""}
      ${d.file ? `<a class="btn primary" href="${toUrl(d.file)}" download><i class="fa-solid fa-download"></i> 다운로드</a>` : ""}
    </div>
    <div class="slot" id="slot-${key}"></div>
  </div>`;
}

function renderDocs(panel) {
  const items = DB.docs.filter(d => d.area === state.area && d.kind !== "비디오");
  if (!items.length) { panel.innerHTML = emptyBox("등록된 절차서·양식이 없습니다."); return; }
  const order = ["절차서", "양식", "부적합 사례"];
  const kinds = [...new Set([...order.filter(k => items.some(d => d.kind === k)),
                             ...items.map(d => d.kind)])];
  panel.innerHTML = kinds.map(k => `
    <h2>${esc(k) || "구분 미입력"}</h2>
    <div class="list">${items.map((d, i) => d.kind === k ? docItem(d, i) : "").join("")}</div>`).join("");
  panel.onclick = e => {
    const b = e.target.closest("[data-view]");
    if (!b) return;
    const slot = document.getElementById("slot-" + b.dataset.view);
    if (slot.innerHTML) { slot.innerHTML = ""; b.innerHTML = '<i class="fa-regular fa-eye"></i> 미리보기'; }
    else {
      slot.innerHTML = `<iframe class="pdf" src="${toUrl(items[b.dataset.view].view)}"></iframe>`;
      b.innerHTML = '<i class="fa-solid fa-xmark"></i> 닫기';
    }
  };
}

/* ---------- 비디오 ---------- */
function playerHtml(src) {
  const yt = youtubeId(src);
  if (yt) return `<div class="player"><iframe src="https://www.youtube.com/embed/${yt}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  return `<div class="player"><video src="${toUrl(src)}" controls preload="metadata"></video></div>`;
}

function renderVideo(panel) {
  const items = DB.docs.filter(d => d.area === state.area && d.kind === "비디오");
  if (!items.length) { panel.innerHTML = emptyBox("이 분야에 등록된 비디오가 없습니다."); return; }
  panel.innerHTML = `<div class="list">${items.map(v => `
    <div class="item">
      <div class="info">
        <div class="title">${titleOf(v.title)}</div>
        <div class="slot">${v.file ? playerHtml(v.file) : '<div class="desc missing">파일 경로 미입력</div>'}</div>
      </div>
    </div>`).join("")}</div>`;
}

/* ---------- 시험 ---------- */
function renderQuiz(panel) {
  const qs = DB.quiz.filter(q => q.area === state.area).sort((a, b) => a.no - b.no);
  if (!qs.length) { panel.innerHTML = emptyBox("이 분야에 등록된 시험문제가 없습니다."); return; }

  panel.innerHTML = `
    <div class="result" id="result"></div>
    <form id="quizForm" autocomplete="off">
      ${qs.map((q, i) => `
        <div class="q" id="q${i}">
          <div class="q-head"><span>Q${i + 1}.</span><span>${esc(q.q)}</span><span class="tag">${esc(q.type)}</span></div>
          ${q.type === "주관식"
            ? `<textarea name="q${i}" placeholder="답안을 입력하세요..."></textarea>`
            : q.options.map((o, j) => `
              <label data-j="${j + 1}"><input type="radio" name="q${i}" value="${j + 1}"><span>${j + 1}) ${esc(o)}</span></label>`).join("")}
          <div class="feedback" hidden></div>
        </div>`).join("")}
      <div class="quiz-actions">
        <button type="submit" class="btn primary"><i class="fa-solid fa-check"></i> 채점하기</button>
        <button type="button" class="btn" id="retry"><i class="fa-solid fa-rotate-right"></i> 다시 풀기</button>
      </div>
      <div class="warn" id="warn"></div>
    </form>`;

  const form = document.getElementById("quizForm");
  form.onsubmit = e => {
    e.preventDefault();
    let mcTotal = 0, mcOk = 0, saTotal = 0, unanswered = 0;
    qs.forEach((q, i) => {
      const box = document.getElementById("q" + i);
      const fb = box.querySelector(".feedback");
      box.classList.remove("correct", "wrong", "self");
      fb.hidden = false;
      if (q.type === "주관식") {
        saTotal++;
        if (!str(form.elements["q" + i].value)) unanswered++;
        box.classList.add("self");
        fb.innerHTML = `<b><i class="fa-solid fa-lightbulb"></i> 모범답안</b>${esc(q.answer) || '<span class="missing">모범답안 미입력</span>'}`
          + (q.explain ? `<b style="margin-top:8px"><i class="fa-solid fa-circle-info"></i> 해설</b>${esc(q.explain)}` : "");
      } else {
        mcTotal++;
        const sel = form.querySelector(`input[name="q${i}"]:checked`);
        if (!sel) unanswered++;
        const ans = parseInt(q.answer, 10);
        const ok = !!sel && +sel.value === ans;
        if (ok) mcOk++;
        box.classList.add(ok ? "correct" : "wrong");
        box.querySelectorAll("label").forEach(l => l.classList.toggle("answer", +l.dataset.j === ans));
        fb.innerHTML = `<b>${ok ? '<i class="fa-solid fa-circle-check"></i> 정답입니다.' : '<i class="fa-solid fa-circle-xmark"></i> 오답입니다.' + (ans ? ` (정답: ${ans}번)` : " (정답 미입력)")}</b>`
          + (q.explain ? esc(q.explain) : "");
      }
    });
    const result = document.getElementById("result");
    result.style.display = "block";
    result.innerHTML = (mcTotal ? `<strong>객관식 ${mcTotal}문제 중 ${mcOk}문제 정답</strong>` : "")
      + (saTotal ? `<div style="margin-top: 4px; font-size: 0.95rem; color: var(--text-secondary);">주관식 ${saTotal}문제는 모범답안과 직접 비교해보세요.</div>` : "");
    document.getElementById("warn").textContent = unanswered ? `답하지 않은 문제가 ${unanswered}개 있습니다.` : "";
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  document.getElementById("retry").onclick = () => { renderQuiz(panel); window.scrollTo({ top: 0, behavior: "smooth" }); };
}

/* ---------- 참고자료 ---------- */
function renderRefs(panel) {
  const items = DB.refs.filter(r => r.area === state.area || r.area === "공통");
  if (!items.length) { panel.innerHTML = emptyBox("이 분야에 등록된 참고자료가 없습니다."); return; }
  panel.innerHTML = `<div class="list">${items.map((r, i) => {
    const yt = youtubeId(r.url);
    return `
    <div class="item">
      <div class="info">
        <div class="title">${titleOf(r.title)}</div>
        ${r.desc ? `<div class="desc">${esc(r.desc)}</div>` : ""}
        ${!r.url ? '<div class="desc missing">URL 미입력</div>' : ""}
      </div>
      <div class="actions">
        ${r.kind ? `<span class="tag">${esc(r.kind)}</span>` : ""}
        ${yt ? `<button class="btn" data-play="${i}"><i class="fa-solid fa-play"></i> 재생</button>` : ""}
        ${r.url ? `<a class="btn primary" href="${esc(r.url)}" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> 열기</a>` : ""}
      </div>
      <div class="slot" id="ref-${i}"></div>
    </div>`;
  }).join("")}</div>`;
  panel.onclick = e => {
    const b = e.target.closest("[data-play]");
    if (!b) return;
    const slot = document.getElementById("ref-" + b.dataset.play);
    if (slot.innerHTML) { slot.innerHTML = ""; b.innerHTML = '<i class="fa-solid fa-play"></i> 재생'; }
    else { slot.innerHTML = playerHtml(items[b.dataset.play].url); b.innerHTML = '<i class="fa-solid fa-xmark"></i> 닫기'; }
  };
}

load();
</script>
</body>
</html>
