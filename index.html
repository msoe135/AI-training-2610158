<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA Portfolio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --blue: #2340b8;
    --blue-dark: #1a3091;
    --blue-soft: #eef1fb;
    --ink: #1c2230;
    --ink-2: #566074;
    --ink-3: #8c95a6;
    --line: #e3e7ee;
    --bg: #f6f7fa;
    --card: #ffffff;
    --danger: #c0392b;
    --header-h: 82px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid #7f95ee; outline-offset: 2px; }

  /* ---------- HEADER ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    height: var(--header-h);
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .header-in {
    max-width: 1220px; height: 100%; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .brand {
    font-size: 1.35rem; font-weight: 700; color: var(--blue);
    text-decoration: none; letter-spacing: -0.01em; white-space: nowrap;
  }
  nav.top { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  nav.top::-webkit-scrollbar { display: none; }
  nav.top button {
    border: 0; background: none; cursor: pointer; font: inherit;
    font-size: 0.95rem; font-weight: 500; color: var(--ink);
    padding: 8px 14px; border-radius: 6px; white-space: nowrap;
    border-bottom: 2px solid transparent;
  }
  nav.top button:hover { color: var(--blue); }
  nav.top button.active { color: var(--blue); border-bottom-color: var(--blue); border-radius: 6px 6px 0 0; }

  /* ---------- HERO ---------- */
  /* 배경 사진은 index.html과 같은 폴더에 hero.jpg (또는 hero.png / hero.webp) 로 넣으면 적용됩니다. */
  .hero {
    position: relative;
    min-height: calc(100vh - var(--header-h));
    display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    color: #fff; text-align: center;
    background-color: #14301f;
    background-image:
      linear-gradient(rgba(6, 14, 8, 0.50), rgba(6, 14, 8, 0.56)),
      url('hero.jpg'), url('hero.png'), url('hero.webp'),
      radial-gradient(ellipse at 50% 30%, #2f5a3a 0%, #14301f 70%);
    background-size: cover; background-position: center;
    transition: min-height 0.35s ease;
  }
  .hero.compact { min-height: 360px; }
  .hero-title {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 56px 24px 24px;
  }
  .hero h1 {
    font-size: clamp(1.9rem, 4.4vw, 3.3rem);
    font-weight: 700; line-height: 1.3; letter-spacing: -0.02em;
    text-shadow: 0 2px 14px rgba(0,0,0,0.45);
  }
  .hero.compact h1 { font-size: clamp(1.6rem, 3.2vw, 2.4rem); }
  .hero .sub { margin-top: 10px; font-size: 1rem; font-weight: 300; opacity: 0.85; }

  .menu {
    display: flex; justify-content: center; align-items: flex-start; flex-wrap: wrap;
    gap: 18px clamp(18px, 3.2vw, 56px);
    padding: 0 20px 36px; width: 100%;
  }
  .menu button {
    border: 0; background: none; cursor: pointer; color: #fff; font: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    width: 120px;
  }
  .menu button:nth-child(even) { transform: translateY(-22px); }
  .menu .circle {
    width: 96px; height: 96px; border-radius: 50%;
    display: grid; place-items: center; font-size: 2rem;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.38);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .menu button:hover .circle { background: rgba(255, 255, 255, 0.22); border-color: rgba(255,255,255,0.8); transform: scale(1.06); }
  .menu button.active .circle { background: rgba(255, 255, 255, 0.28); border-color: #fff; }
  .menu .label { font-size: 0.88rem; font-weight: 500; line-height: 1.35; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  .hero.compact .menu { padding-bottom: 24px; }
  .hero.compact .menu .circle { width: 64px; height: 64px; font-size: 1.35rem; }
  .hero.compact .menu button { width: 104px; gap: 8px; }
  .hero.compact .menu button:nth-child(even) { transform: none; }

  /* ---------- CONTENT ---------- */
  main { display: none; padding: 40px 0 90px; }
  main.show { display: block; }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 0 24px; }

  .page-head { margin-bottom: 8px; }
  .page-head h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
  .page-head p { color: var(--ink-2); margin-top: 4px; font-size: 0.95rem; }

  .tabs {
    display: flex; gap: 4px; margin: 22px 0 8px; border-bottom: 1px solid var(--line);
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    border: 0; background: none; font: inherit; cursor: pointer; white-space: nowrap;
    padding: 11px 16px; font-size: 0.93rem; font-weight: 500; color: var(--ink-2);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button:hover { color: var(--blue); }
  .tabs button.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }

  h3.group {
    font-size: 1.02rem; font-weight: 700; margin: 30px 0 12px;
    padding-left: 10px; border-left: 4px solid var(--blue);
  }
  h2.topic-sep {
    font-size: 1.25rem; font-weight: 700; margin: 46px 0 0; padding-top: 28px;
    border-top: 2px solid var(--ink);
  }
  h2.topic-sep:first-of-type { margin-top: 24px; border-top: 0; padding-top: 0; }

  .list { display: grid; gap: 10px; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 12px 16px;
  }
  .item .info { flex: 1; min-width: 220px; }
  .item .code { font-size: 0.78rem; font-weight: 700; color: var(--blue); }
  .item .name { font-weight: 500; font-size: 1rem; }
  .item .note { color: var(--ink-2); font-size: 0.88rem; margin-top: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 0.85rem; font-weight: 500;
    padding: 7px 13px; border-radius: 6px; cursor: pointer; text-decoration: none;
    background: #fff; color: var(--ink-2); border: 1px solid var(--line);
  }
  .btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); color: #fff; }
  .slot { flex-basis: 100%; }
  .slot:empty { display: none; }
  .slot iframe.pdf { width: 100%; height: 76vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .slot video { width: 100%; max-height: 70vh; border-radius: 8px; background: #000; }

  .ref .name { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .ref .std { font-weight: 700; }

  .empty {
    border: 1.5px dashed #cdd3de; border-radius: 8px; background: #fff;
    padding: 34px 20px; text-align: center; color: var(--ink-3); font-size: 0.93rem;
  }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 22px 24px; }
  .panel + .panel { margin-top: 12px; }
  .panel h4 { font-size: 1rem; margin-bottom: 6px; }
  .panel p, .panel li { color: var(--ink-2); font-size: 0.94rem; }
  .panel ul { padding-left: 20px; }

  footer { text-align: center; color: var(--ink-3); font-size: 0.82rem; padding: 26px 0 34px; }

  @media (max-width: 760px) {
    :root { --header-h: 120px; }
    .header-in { flex-direction: column; justify-content: center; gap: 4px; align-items: flex-start; }
    nav.top { width: 100%; }
    .menu .circle { width: 72px; height: 72px; font-size: 1.5rem; }
    .menu button { width: 92px; }
    .menu button:nth-child(even) { transform: none; }
    .hero.compact .menu .circle { width: 54px; height: 54px; font-size: 1.1rem; }
    .hero.compact .menu button { width: 84px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header>
  <div class="header-in">
    <a class="brand" href="#home" id="brand">RA Portfolio</a>

  <div class="hero-title">

  </div>
  <nav class="menu" id="menu" aria-label="주제 선택"></nav>
</section>

<main id="main"><div class="wrap" id="content"></div></main>

        files: { pdf: `${C}/002. 관련 양식/001. 시정조치 및 예방조치 요구, 보고서/QP-85-01-F01_시정_및_예방조치_요구_보고서.pdf`, docx: `${C}/002. 관련 양식/001. 시정조치 및 예방조치 요구, 보고서/QP-85-01-F01_시정_및_예방조치_요구_보고서.docx` } },
      { kind: "양식", code: "QP-85-01-F01", title: "시정조치 및 예방조치 관리대장",
        files: { pdf: `${C}/002. 관련 양식/002. 시정조치 및 예방조치 요구, 보고서 관리 대장/QP-85-01-F01_시정조치_및_예방조치_관리대장.pdf`, xlsx: `${C}/002. 관련 양식/002. 시정조치 및 예방조치 요구, 보고서 관리 대장/QP-85-01-F01_시정조치_및_예방조치_관리대장.xlsx` } },
    ],
    refs: [
      { std: "ISO 13485:2016 8.3", title: "부적합 제품의 관리", desc: "부적합 식별·처리 요구사항" },
      { std: "ISO 13485:2016 8.5.2", title: "시정조치", desc: "원인 분석 및 재발 방지 조치" },
      { std: "ISO 13485:2016 8.5.3", title: "예방조치", desc: "잠재 부적합 원인 제거" },
    ],
    review: [],
    found: [
      { kind: "부적합 보고서", code: "QP-85-01", title: "부적합 보고서(NCR)",
        files: { pdf: `${C}/004. 부적합/QP-85-01_부적합보고서_NCR_회신.pdf`, docx: `${C}/004. 부적합/QP-85-01_부적합보고서_NCR_회신.docx` } },
    ],
    fixed: [
      { kind: "NCR 회신", code: "QP-85-01", title: "부적합 보고서(NCR) 회신",
        files: { pdf: `${C}/004. 부적합/QP-85-01_부적합보고서_NCR_회신.pdf`, docx: `${C}/004. 부적합/QP-85-01_부적합보고서_NCR_회신.docx` } },
    ],
  },
  {
    id: "udi", icon: "fa-barcode", label: "UDI 관리", name: "UDI 관리",
    desc: "QP-758-01 UDI 절차서와 관련 양식 (F01~F03)",
    docs: [
      { kind: "절차서", code: "QP-758-01", title: "UDI 절차서",
        files: { pdf: `${U}/001. 절차서/QP-758-01_UDI_절차서.pdf`, docx: `${U}/001. 절차서/QP-758-01_UDI_절차서.docx` } },
      { kind: "양식", code: "QP-758-01-F01", title: "UDI 체계 수립 및 코드 생성 기록",
        files: { pdf: `${U}/002. 관련 양식/001. UDI 체계 수립 및 코드 생성/QP-758-01-F01_UDI체계수립및코드생성기록.pdf`, docx: `${U}/002. 관련 양식/001. UDI 체계 수립 및 코드 생성/QP-758-01-F01_UDI체계수립및코드생성기록.docx` } },
      { kind: "양식", code: "QP-758-01-F02", title: "라벨링 및 포장 인쇄 적용",
        files: { pdf: `${U}/002. 관련 양식/002. 라벨링 및 포장 인쇄 적용/QP-758-01-F02(마이크로카테터_UDI품질절차서_라벨링 및 포장인쇄).pdf`, docx: `${U}/002. 관련 양식/002. 라벨링 및 포장 인쇄 적용/QP-758-01-F02(마이크로카테터_UDI품질절차서_라벨링 및 포장인쇄).docx` } },
      { kind: "양식", code: "QP-758-01-F03", title: "통합시스템 등록 및 추적관리",
        files: { pdf: `${U}/002. 관련 양식/003. 통합시스템 등록 및 추적관리/QP-758-01-F03_작성예시_KMHSE-02-10.pdf`, docx: `${U}/002. 관련 양식/003. 통합시스템 등록 및 추적관리/QP-758-01-F03_작성예시_KMHSE-02-10.docx` } },
    ],
    refs: [
      { std: "의료기기 UDI 관련 규정(식약처)", title: "의료기기 고유식별코드(UDI) 표시·보고", desc: "UDI 표기, 통합정보센터 등록·공급내역 보고" },
      { std: "GS1 General Specifications", title: "GS1 표준", desc: "GTIN, 로트·제조일·유효기한 등 AI 구성" },
      { std: "ISO 13485:2016 7.5.8 / 7.5.9", title: "식별 및 추적성", desc: "제품 식별과 추적성 확보 요구" },
    ],
    review: [], found: [], fixed: [],
  },
];

/* 상단 아이콘 메뉴 */
const MENU = [
  { id: "home", icon: "fa-house", label: "홈" },
  ITEM,
  ...TOPICS,
];

/* ================= 화면 로직 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toUrl = p => String(p).split("/").map(encodeURIComponent).join("/");
const extOf = p => p.split(".").pop().toLowerCase();

let state = { topic: "home", tab: null };

function parseHash() {
  const [t, tab] = decodeURIComponent(location.hash.slice(1)).split("/");
  state.topic = MENU.some(m => m.id === t) ? t : "home";
  state.tab = TABS.some(x => x.id === tab) ? tab : null;
  if (state.topic !== "home" && state.topic !== "item" && !state.tab) state.tab = "docs";
}
function go(topic, tab) {
  state.topic = topic;
  state.tab = tab ?? null;
  if (topic !== "home" && topic !== "item" && !state.tab) state.tab = "docs";
  history.replaceState(null, "", "#" + topic + (state.tab ? "/" + state.tab : ""));
  render();
  window.scrollTo({ top: 0 });
}

/* ---- 서류 카드 ---- */
let uid = 0;
function docItem(d) {
  const f = d.files || {};
  const id = "s" + (uid++);
  const others = Object.entries(f).filter(([k]) => k !== "pdf" && k !== "video");
  return `
  <div class="item">
    <div class="info">
      ${d.code ? `<div class="code">${esc(d.code)}</div>` : ""}
      <div class="name">${esc(d.title)}</div>
      ${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}
    </div>
    <div class="actions">
      ${f.pdf ? `<button class="btn" data-pdf="${esc(f.pdf)}" data-slot="${id}"><i class="fa-regular fa-eye"></i> 미리보기</button>
                 <a class="btn" href="${toUrl(f.pdf)}" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> 새 창</a>` : ""}
      ${f.video ? `<button class="btn" data-video="${esc(f.video)}" data-slot="${id}"><i class="fa-solid fa-play"></i> 영상 재생</button>` : ""}
      ${others.map(([k, p]) => `<a class="btn primary" href="${toUrl(p)}" download><i class="fa-solid fa-download"></i> ${esc(k.toUpperCase())}</a>`).join("")}
      ${f.pdf ? `<a class="btn primary" href="${toUrl(f.pdf)}" download><i class="fa-solid fa-download"></i> PDF</a>` : ""}
    </div>
    <div class="slot" id="${id}"></div>
  </div>`;
}

function docsHtml(list, emptyMsg) {
  if (!list.length) return `<div class="empty">${emptyMsg}</div>`;
  const kinds = [...new Set(list.map(d => d.kind))];
  return kinds.map(k => `
    <h3 class="group">${esc(k)}</h3>
    <div class="list">${list.filter(d => d.kind === k).map(docItem).join("")}</div>`).join("");
}

function refsHtml(list) {
  if (!list.length) return `<div class="empty">참고 규격을 입력하면 이곳에 표시됩니다.</div>`;
  return `<div class="list">${list.map(r => `
    <div class="item ref"><div class="info">
      <div class="name"><span class="std">${esc(r.std)}</span><span>${esc(r.title)}</span></div>
      ${r.desc ? `<div class="note">${esc(r.desc)}</div>` : ""}
    </div></div>`).join("")}</div>`;
}

function reviewHtml(list) {
  if (!list.length) return `<div class="empty">서류 평가 내용을 입력하면 이곳에 표시됩니다.</div>`;
  return list.map(r => `<div class="panel"><h4>${esc(r.title)}</h4><p>${esc(r.text)}</p></div>`).join("");
}

function tabBody(t, tab) {
  switch (tab) {
    case "docs":   return docsHtml(t.docs, "등록된 서류가 없습니다.");
    case "refs":   return refsHtml(t.refs);
    case "review": return reviewHtml(t.review);
    case "found":  return docsHtml(t.found, "발견된 부적합 사항이 아직 등록되지 않았습니다.");
    case "fixed":  return docsHtml(t.fixed, "부적합 수정 사항이 아직 등록되지 않았습니다.");
  }
}

/* ---- 화면 그리기 ---- */
function renderTopNav() {
  $("topNav").innerHTML = TABS.map(t =>
    `<button data-tab="${t.id}" class="${state.tab === t.id ? "active" : ""}">${t.label}</button>`).join("");
}
function renderMenu() {
  $("menu").innerHTML = MENU.map(m => `
    <button data-topic="${m.id}" class="${state.topic === m.id ? "active" : ""}">
      <span class="circle"><i class="fa-solid ${m.icon}"></i></span>
      <span class="label">${m.label}</span>
    </button>`).join("");
}

function render() {
  const { topic, tab } = state;
  const isHomeIdle = topic === "home" && !tab;
  const hero = $("hero"), main = $("main"), content = $("content");

  hero.classList.toggle("compact", !isHomeIdle);
  main.classList.toggle("show", !isHomeIdle);
  renderTopNav();
  renderMenu();

  const cur = MENU.find(m => m.id === topic);
  if (topic === "home") {
    $("heroTitle").innerHTML = isHomeIdle ? HOME.title : "전체 서류";
    $("heroSub").textContent = isHomeIdle ? "" : "모든 주제의 " + TABS.find(x => x.id === tab).label;
  } else if (topic === "item") {
    $("heroTitle").innerHTML = ITEM.title;
    $("heroSub").textContent = "";
  } else {
    $("heroTitle").innerHTML = cur.name;
    $("heroSub").textContent = cur.desc;
  }
  if (isHomeIdle) return;

  if (topic === "item") {
    content.innerHTML = `
      <div class="page-head"><h2>${ITEM.title}</h2></div>
      ${ITEM.reasons.length
        ? `<div class="panel"><ul>${ITEM.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>`
        : `<div class="empty">품목 선정 이유를 입력하면 이곳에 표시됩니다.</div>`}`;
    return;
  }

  const tabs = `<div class="tabs">${TABS.map(t =>
    `<button data-tab="${t.id}" class="${tab === t.id ? "active" : ""}">${t.label}</button>`).join("")}</div>`;
  const label = TABS.find(x => x.id === tab).label;

  if (topic === "home") {
    content.innerHTML = `<div class="page-head"><h2>${label}</h2><p>모든 주제를 한 번에 모아 봅니다.</p></div>${tabs}`
      + TOPICS.map(t => `<h2 class="topic-sep">${esc(t.name)}</h2>${tabBody(t, tab)}`).join("");
  } else {
    const t = TOPICS.find(x => x.id === topic);
    content.innerHTML = `<div class="page-head"><h2>${esc(t.name)}</h2><p>${esc(t.desc)}</p></div>${tabs}${tabBody(t, tab)}`;
  }
}

/* ---- 이벤트 ---- */
document.addEventListener("click", e => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { go(state.topic === "item" ? "home" : state.topic, tabBtn.dataset.tab); return; }

  const topicBtn = e.target.closest("[data-topic]");
  if (topicBtn) { go(topicBtn.dataset.topic, topicBtn.dataset.topic === "home" ? null : state.tab && state.topic !== "item" ? state.tab : "docs"); return; }

  if (e.target.closest("#brand")) { e.preventDefault(); go("home", null); return; }

  const pdfBtn = e.target.closest("[data-pdf]");
  const vidBtn = e.target.closest("[data-video]");
  const btn = pdfBtn || vidBtn;
  if (btn) {
    const slot = $(btn.dataset.slot);
    const open = !!slot.innerHTML;
    const origin = pdfBtn ? '<i class="fa-regular fa-eye"></i> 미리보기' : '<i class="fa-solid fa-play"></i> 영상 재생';
    if (open) { slot.innerHTML = ""; btn.innerHTML = origin; }
    else {
      slot.innerHTML = pdfBtn
        ? `<iframe class="pdf" src="${toUrl(btn.dataset.pdf)}" title="PDF 미리보기"></iframe>`
        : `<video src="${toUrl(btn.dataset.video)}" controls preload="metadata"></video>`;
      btn.innerHTML = '<i class="fa-solid fa-xmark"></i> 닫기';
    }
  }
});
window.addEventListener("hashchange", () => { parseHash(); render(); });

parseHash();
render();
</script>
</body>
</html>
